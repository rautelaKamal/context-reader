<!doctype html>
<meta charset="utf-8" />
<title>ContextReader</title>
<style>
  :root { color-scheme: light dark; }
  body {
    width: 260px; margin: 0; padding: 16px;
    font: 13px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
    background: #fffdf9; color: #1c1917;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #1c1917; color: #f5f5f4; }
    kbd { background: #292524; border-color: #44403c; }
  }
  h1 { margin: 0 0 4px; font-size: 14px; }
  p { margin: 0 0 10px; color: #78716c; }
  ol { margin: 0; padding-left: 18px; }
  li { margin-bottom: 6px; }
  kbd {
    font: 11px/1 ui-monospace, monospace; padding: 2px 5px;
    border: 1px solid #e7e5e4; border-radius: 4px; background: #f5f5f4;
  }
</style>
<h1>ContextReader</h1>
<p>Works on any page you are reading.</p>
<ol>
  <li>Select a passage that lost you.</li>
  <li>Click <strong>Explain</strong>, or press <kbd>⌘⇧E</kbd> / <kbd>Ctrl⇧E</kbd>.</li>
  <li>Switch lenses with the chips at the top of the card.</li>
</ol>
