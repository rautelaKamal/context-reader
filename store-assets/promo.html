<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#f3f4f0;font-family:'IBM Plex Sans',system-ui;color:#151a2d;overflow:hidden}
  .tile{display:flex;align-items:center;justify-content:center;gap:var(--gap);padding:var(--pad);height:100vh}
  .mark{flex-shrink:0}
  .copy .name{font-family:Literata,serif;font-weight:600;letter-spacing:-.01em}

  .copy .quote{font-family:Literata,serif;margin-top:14px;line-height:1.45}
  .copy .quote mark{background:#cfcbf2;color:inherit;padding:1px 0}
  /* 440x280 */
  body.small .tile{--gap:18px;--pad:32px;flex-direction:column;align-items:flex-start;justify-content:center}
  body.small .name{font-size:38px}
  body.small .line{font-size:19px}
  body.small .mark{width:76px;height:76px}
  body.small .quote{display:none}
  /* 1400x560 */
  body.wide .tile{--gap:64px;--pad:60px}
  body.wide .name{font-size:76px}
  body.wide .line{font-size:31px;margin-top:12px}
  body.wide .quote{font-size:30px;max-width:34ch;margin-top:22px}
  body.wide .mark{width:190px;height:190px}
</style>
