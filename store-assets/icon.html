<!doctype html><meta charset="utf-8">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:128px;height:128px;overflow:hidden}
  .tile{
    width:128px;height:128px;background:#151a2d;border-radius:28px;
    display:flex;flex-direction:column;justify-content:center;gap:11px;
    padding:0 24px;
  }
  /* lines of text, with the one you selected marked */
  .l{height:11px;border-radius:3px;background:#6f7689}
  .l.a{width:100%}
  .l.b{width:78%}
  .l.mark{background:#cfcbf2;width:100%}
  .l.d{width:56%}
</style>
<div class="tile">
  <div class="l a"></div>
  <div class="l mark"></div>
  <div class="l b"></div>
  <div class="l d"></div>
</div>
