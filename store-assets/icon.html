<!doctype html><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,700&display=swap">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:transparent}
  body{
    width:128px;height:128px;overflow:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;
  }
  /* One bold serif letterform as a shape, over the product's own gesture:
     a marker stroke that overshoots the word slightly, as a real one does. */
  .c{
    font-family:Literata,Georgia,serif;font-weight:700;font-size:96px;
    line-height:.82;color:#151a2d;
  }
  .stroke{width:84px;height:17px;border-radius:4px;background:#a79fe8}
</style>
<span class="c">C</span>
<span class="stroke"></span>
